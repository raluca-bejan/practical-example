<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">Invoice parsing agent architecture</title>
  <desc id="desc">Streamlit uploads pass through deterministic JSON parsing and validation. Failed parsing or validation loads the invoice parsing skill, uses OpenAI to call the local validation tool, and ends in success or human review. All actions are saved to JSON and JSONL traces; the API key stays in a local environment file.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker>
    <style>
      text {font-family:system-ui,-apple-system,sans-serif;fill:#172554}
      .box {fill:white;stroke:#94a3b8;stroke-width:1.5;rx:12}
      .label {font-size:16px;font-weight:600;text-anchor:middle}
      .sub {font-size:13px;text-anchor:middle;fill:#475569}
      .edge {fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .note {font-size:12px;fill:#475569}
    </style>
  </defs>
  <rect width="1100" height="820" fill="#f8fafc"/>
  <text x="42" y="48" font-size="26" font-weight="700">Invoice parsing agent</text>
  <text x="42" y="74" font-size="14" fill="#475569">JSON first · one semantic attempt · local validation decides the outcome</text>
  <rect x="350" y="108" width="340" height="64" class="box"/>
  <text x="520" y="134" class="label">Streamlit upload</text><text x="520" y="155" class="sub">UTF-8 .txt / .json · up to 100 KB</text>
  <path d="M520 172 V208" class="edge"/>
  <rect x="350" y="208" width="340" height="70" class="box"/>
  <text x="520" y="236" class="label">Deterministic JSON parsing</text><text x="520" y="258" class="sub">Schema + Decimal arithmetic validation</text>
  <path d="M350 242 H184 V506" class="edge"/>
  <text x="208" y="231" class="note">Valid</text>
  <path d="M520 278 V318" class="edge"/>
  <text x="535" y="303" class="note">Decode or validation failed</text>
  <rect x="350" y="318" width="340" height="64" class="box"/>
  <text x="520" y="344" class="label">Load parsing skill</text><text x="520" y="365" class="sub">skills/parse_invoice.ms</text>
  <path d="M520 382 V418" class="edge"/>
  <rect x="350" y="418" width="340" height="64" class="box"/>
  <text x="520" y="444" class="label">OpenAI extraction</text><text x="520" y="465" class="sub">Python SDK · required function call</text>
  <rect x="800" y="418" width="255" height="64" class="box"/>
  <text x="927" y="444" class="label">Local .env</text><text x="927" y="465" class="sub">API key · excluded from Git / ZIP</text>
  <path d="M800 450 H690" class="edge" stroke-dasharray="5 5"/>
  <path d="M520 482 V518" class="edge"/>
  <rect x="350" y="518" width="340" height="70" class="box"/>
  <text x="520" y="546" class="label">validate_invoice tool</text><text x="520" y="568" class="sub">Same schema and arithmetic checks</text>
  <path d="M350 554 H305" class="edge"/>
  <text x="313" y="540" class="note">Valid</text>
  <rect x="52" y="506" width="253" height="88" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="178" y="539" class="label">All great</text><text x="178" y="562" class="sub">Validated structured invoice</text><text x="178" y="580" class="sub">Result + trace downloads</text>
  <path d="M690 554 H800" class="edge"/>
  <text x="709" y="540" class="note">Invalid</text>
  <rect x="800" y="506" width="255" height="88" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="927" y="539" class="label">Human review required</text><text x="927" y="562" class="sub">All errors + available fields</text><text x="927" y="580" class="sub">Correct source and re-upload</text>
  <path d="M690 350 H754 V606 H927 V594" class="edge"/>
  <text x="763" y="377" class="note">Configuration / API /</text><text x="763" y="394" class="note">extraction errors</text>
  <path d="M690 450 H754" fill="none" stroke="#64748b" stroke-width="1.8"/>
  <rect x="350" y="660" width="340" height="60" class="box"/>
  <text x="520" y="685" class="label">Every action is traced</text><text x="520" y="706" class="sub">Run ID · timestamps · tool calls · errors · outcome</text>
  <path d="M520 588 V660" class="edge" stroke-dasharray="5 5"/>
  <text x="535" y="635" class="note">Tracing spans the entire workflow</text>
  <path d="M350 690 H295" class="edge"/>
  <rect x="52" y="660" width="243" height="60" class="box"/>
  <text x="173" y="685" class="label">actions.json</text><text x="173" y="706" class="sub">Agent messages start with [agent]</text>
  <path d="M690 690 H800" class="edge"/>
  <rect x="800" y="660" width="255" height="60" class="box"/>
  <text x="927" y="685" class="label">traces/&lt;run_id&gt;.jsonl</text><text x="927" y="706" class="sub">One event per line, one file per run</text>
  <text x="42" y="775" font-size="13" fill="#475569">Shared contract: schemas/invoice.schema.json · Local human-review handoff · No automatic repair or training</text>
</svg>
